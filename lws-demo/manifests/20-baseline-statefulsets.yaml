# BASELINE: the "classic" way to run the same multi-pod model without LWS.
# One leader StatefulSet + one worker StatefulSet, glued together by hand and hope.

apiVersion: v1
kind: Service
metadata:
  name: baseline
  namespace: lws-demo
spec:
  clusterIP: None                 # headless, for per-pod DNS
  publishNotReadyAddresses: true
  selector: {app: baseline}
  ports: [{name: agent, port: 8080}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: baseline-leader
  namespace: lws-demo
spec:
  serviceName: baseline
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: baseline, role: leader}
  template:
    metadata:
      labels: {app: baseline, role: leader, chaos-target: "true"}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --model=fake-llm-70b
            - --port=8000
            - --mode=random
            - --time-to-first-token=200ms
            - --inter-token-latency=20ms
            - --startup-duration=5s
          ports: [{name: http, containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
        - name: agent
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/agent/group-agent.sh"]
          env:
            - {name: ROLE, value: leader}
            - {name: LEADER_HOST, value: baseline-leader-0.baseline}
            - {name: WORKER_HOSTS, value: "baseline-worker-0.baseline baseline-worker-1.baseline"}
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ready"]}
            periodSeconds: 1
          volumeMounts: [{name: agent, mountPath: /agent}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
      volumes:
        - name: agent
          configMap: {name: group-agent}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: baseline-worker
  namespace: lws-demo
spec:
  serviceName: baseline
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: baseline, role: worker}
  template:
    metadata:
      labels: {app: baseline, role: worker, chaos-target: "true"}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: agent
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/agent/group-agent.sh"]
          env:
            - {name: ROLE, value: worker}
            - {name: LEADER_HOST, value: baseline-leader-0.baseline}
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ready"]}
            periodSeconds: 1
          volumeMounts: [{name: agent, mountPath: /agent}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
      volumes:
        - name: agent
          configMap: {name: group-agent}
---
apiVersion: v1
kind: Service
metadata:
  name: baseline-api
  namespace: lws-demo
spec:
  selector: {app: baseline, role: leader}
  ports: [{name: http, port: 8000, targetPort: 8000}]
