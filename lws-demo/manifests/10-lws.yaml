# LeaderWorkerSet: 2 replicas (= 2 independent model instances),
# each replica is a group of 3 pods: 1 leader (API + rank 0) + 2 workers (shards).

apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: lws-sim
  namespace: lws-demo
  annotations:
    # all pods of a group land on the same node and no two groups share a node
    leaderworkerset.sigs.k8s.io/exclusive-topology: kubernetes.io/hostname
spec:
  replicas: 2
  startupPolicy: LeaderCreated
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdateConfiguration:
      maxUnavailable: 1
      maxSurge: 0
  leaderWorkerTemplate:
    size: 3
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels: {app: lws-sim, role: leader, chaos-target: "true"}
      spec:
        terminationGracePeriodSeconds: 2
        containers:
          - name: sim
            image: ghcr.io/llm-d/llm-d-inference-sim:v1.2.0
            imagePullPolicy: IfNotPresent
            args:
              - --model=fake-llm-70b
              - --port=8000
              - --mode=random
              - --time-to-first-token=200ms
              - --inter-token-latency=20ms
              - --startup-duration=5s        # pretend weight loading
            ports: [{name: http, containerPort: 8000}]
            readinessProbe:
              httpGet: {path: /health/ready, port: 8000}
              periodSeconds: 2
            resources:
              requests: {cpu: 50m, memory: 64Mi}
          - name: agent
            image: busybox:1.36
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/agent/group-agent.sh"]
            env: [{name: ROLE, value: leader}]
            readinessProbe:
              exec: {command: ["test", "-f", "/tmp/ready"]}
              periodSeconds: 1
            volumeMounts: [{name: agent, mountPath: /agent}]
            resources:
              requests: {cpu: 10m, memory: 16Mi}
        volumes:
          - name: agent
            configMap: {name: group-agent}
    workerTemplate:
      metadata:
        labels: {app: lws-sim, role: worker, chaos-target: "true"}
      spec:
        terminationGracePeriodSeconds: 2
        containers:
          - name: agent
            image: busybox:1.36
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/agent/group-agent.sh"]
            env: [{name: ROLE, value: worker}]
            readinessProbe:
              exec: {command: ["test", "-f", "/tmp/ready"]}
              periodSeconds: 1
            volumeMounts: [{name: agent, mountPath: /agent}]
            resources:
              requests: {cpu: 10m, memory: 16Mi}
        volumes:
          - name: agent
            configMap: {name: group-agent}
---
# Client-facing endpoint: only leaders of healthy groups receive traffic.
# (LWS itself creates the headless service "lws-sim" used for in-group DNS.)
apiVersion: v1
kind: Service
metadata:
  name: lws-sim-api
  namespace: lws-demo
spec:
  selector:
    leaderworkerset.sigs.k8s.io/name: lws-sim
    role: leader
  ports: [{name: http, port: 8000, targetPort: 8000}]
